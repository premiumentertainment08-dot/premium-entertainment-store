<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Premium Entertainment Store</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo"><span>PE</span><b>Premium Entertainment<br><small>ADMIN PANEL</small></b></div><a href="index.html">← Store</a></header><main class="admin"><div id="loginBox" class="panel login"><h1>Admin Login</h1><p>Demo dashboard. Production use requires secure server authentication.</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn dark" onclick="login()">Login</button></div><div id="dash" hidden><h1>Dashboard</h1><div class="stats"><div>Products<strong id="pc">0</strong></div><div>Orders<strong>0</strong></div><div>Revenue<strong>₹0</strong></div></div><div class="panel"><h2>Add Product</h2><div class="form"><input id="name" placeholder="Product name"><input id="price" type="number" placeholder="Price"><select id="cat"><option value="subscription">Subscription</option><option value="shared">Shared</option><option value="tools">Tools</option></select></div><button class="btn dark" onclick="add()">Add Product</button></div><div class="panel"><h2>Custom Products</h2><div id="list"></div></div></div></main><script>
const get=()=>JSON.parse(localStorage.petProducts||'[]');function login(){loginBox.hidden=true;dash.hidden=false;show()}function add(){if(!name.value||!price.value)return alert('Enter product name and price');let a=get();a.push({id:Date.now(),name:name.value,price:+price.value,cat:cat.value,icon:'✨',badge:'NEW'});localStorage.petProducts=JSON.stringify(a);name.value='';price.value='';show()}function del(id){localStorage.petProducts=JSON.stringify(get().filter(x=>x.id!==id));show()}function show(){let a=get();pc.textContent=a.length;list.innerHTML=a.map(x=>'<div class="row"><b>'+x.name+'</b><span>₹'+x.price+'</span><button onclick="del('+x.id+')">Delete</button></div>').join('')||'<p>No custom products yet.</p>'}</script></body></html>
